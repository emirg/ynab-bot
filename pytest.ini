[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
markers =
    integration: requires external services such as PostgreSQL
filterwarnings =
    error::ResourceWarning
    ignore::UserWarning:openai._compat
    ignore::coverage.exceptions.CoverageWarning
addopts =
    --cov=src/domain
    --cov=src/application
    --cov=src/infrastructure
    --cov=src/presentation/telegram/formatters.py
    --cov-report=term-missing
    --cov-report=html:htmlcov
    -v
