services:
  app-dev:
    build:
      context: .
    command: python main.py
    env_file:
      - config/.env.dev
    environment:
      APP_MODE: http-dev
      EXTERNAL_MODE: stub
      ENABLE_DEV_ROUTES: "true"
      PORT: 8080
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - .:/app
      - ./data:/app/data

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: ynab_bot
      POSTGRES_USER: ynab
      POSTGRES_PASSWORD: ynab
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app-live:
    build:
      context: .
    command: python main.py
    profiles: ["live-integrations"]
    env_file:
      - config/.env.dev
    environment:
      APP_MODE: http-live
      EXTERNAL_MODE: live
      PORT: 8080
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - .:/app
      - ./data:/app/data

volumes:
  postgres-data:
